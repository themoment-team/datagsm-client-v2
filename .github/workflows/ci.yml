name: CI

on:
  pull_request:
  push:
    # develop은 작업 브랜치, main은 배포 브랜치다. 병합 결과도 두 브랜치에서 확인한다.
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: http://localhost:8080
      # status 앱이 상태를 확인할 서버 주소다. CI에서는 자리 표시용 값만 넣는다.
      STATUS_WEB_BASE_URL: http://localhost:8081
      STATUS_OPENAPI_BASE_URL: http://localhost:8082
      STATUS_OAUTH_AUTHORIZATION_BASE_URL: http://localhost:8083
      STATUS_OAUTH_RESOURCE_BASE_URL: http://localhost:8084
      # 사이드바에서 다른 앱으로 이동할 주소다.
      APP_CLIENT_URL: http://localhost:3000
      APP_DOCS_URL: http://localhost:3002
      APP_STATUS_URL: http://localhost:3003
      APP_PROJECTS_URL: http://localhost:3005
      # client·admin이 로그인에 쓰는 OAuth 값이다. CI에서는 자리 표시용 값만 넣는다.
      OAUTH_AUTHORIZATION_BASE_URL: http://localhost:8083
      OAUTH_CLIENT_ID: ci-client-id
      OAUTH_CLIENT_SECRET: ci-client-secret
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 버전은 package.json의 packageManager(pnpm@12.18.0)를 따른다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check FSD architecture
        run: pnpm lint:fsd

      - name: Check Formatting
        run: pnpm format:check

      - name: Type Check
        run: pnpm check-types

      - name: Unit Test
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E Test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # push 이벤트에는 PR 정보가 없어 커밋 메시지와 실행 링크를 대신 보낸다.
      # 웹훅 시크릿이 없으면(fork PR 포함) 알림만 건너뛰고(ack_no_webhook), 알림이 실패해도 CI 결과는 바꾸지 않는다(nofail 기본값).
      # 새 커밋으로 취소된 실행(cancel-in-progress)은 success()·failure() 모두 아니라서 알리지 않는다.
      - name: Success Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ack_no_webhook: true
          title: '✅ CI 성공'
          noprefix: true
          status: success
          description: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          url: ${{ github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          content: ${{ github.event_name == 'pull_request' && 'PR을 확인해 주세요.' || format('{0} 브랜치 검사를 통과했어요.', github.ref_name) }}
          username: DataGSM CI
          color: 0x4CAF50

      - name: Failure Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ack_no_webhook: true
          title: '❌ CI 실패'
          noprefix: true
          status: failure
          description: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          url: ${{ github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          content: '에러를 확인해 주세요.'
          username: DataGSM CI
          color: 0xe74c3c
