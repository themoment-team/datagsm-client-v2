name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: http://localhost:8080
      # status 앱이 상태를 확인할 서버 주소다. CI에서는 자리 표시용 값만 넣는다.
      STATUS_WEB_BASE_URL: http://localhost:8081
      STATUS_OPENAPI_BASE_URL: http://localhost:8082
      STATUS_OAUTH_AUTHORIZATION_BASE_URL: http://localhost:8083
      STATUS_OAUTH_RESOURCE_BASE_URL: http://localhost:8084
      # 사이드바에서 다른 앱으로 이동할 주소다.
      APP_CLIENT_URL: http://localhost:3000
      APP_DOCS_URL: http://localhost:3002
      APP_STATUS_URL: http://localhost:3003
      APP_PROJECTS_URL: http://localhost:3005
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 버전은 package.json의 packageManager(pnpm@12.18.0)를 따른다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check FSD architecture
        run: pnpm lint:fsd

      - name: Check Formatting
        run: pnpm format:check

      - name: Type Check
        run: pnpm check-types

      - name: Unit Test
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E Test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
